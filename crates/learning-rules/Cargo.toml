[package]
name = "learning-rules"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "learning-rules"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"

